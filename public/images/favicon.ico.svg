<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" width="300" height="300">
  <title>MovieFlix107 Badge</title>

  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- glow -->
  <circle cx="150" cy="150" r="148" fill="url(#glow)"/>

  <!-- outer dashed orbit -->
  <circle cx="150" cy="150" r="142" fill="none" stroke="#A78BFA" stroke-width="0.8" opacity="0.3" stroke-dasharray="4,10"/>

  <!-- main circle -->
  <circle cx="150" cy="150" r="130" fill="#1E1B4B" stroke="#A78BFA" stroke-width="2"/>

  <!-- inner ring -->
  <circle cx="150" cy="150" r="118" fill="none" stroke="#C4B5FD" stroke-width="0.5" opacity="0.2"/>

  <!-- cardinal dots -->
  <circle cx="150" cy="21"  r="4" fill="#A78BFA" opacity="0.7"/>
  <circle cx="150" cy="279" r="4" fill="#A78BFA" opacity="0.7"/>
  <circle cx="21"  cy="150" r="4" fill="#A78BFA" opacity="0.7"/>
  <circle cx="279" cy="150" r="4" fill="#A78BFA" opacity="0.7"/>

  <!-- ── TICKET (left, scaled down) ── -->
  <g transform="translate(34, 108)">
    <rect x="0" y="0" width="80" height="46" rx="7" fill="#0D0B1E" stroke="#A78BFA" stroke-width="1.2"/>
    <circle cx="0"  cy="23" r="7" fill="#1E1B4B"/>
    <circle cx="80" cy="23" r="7" fill="#1E1B4B"/>
    <line x1="26" y1="0" x2="26" y2="46" stroke="#A78BFA" stroke-width="0.7" stroke-dasharray="4,3" opacity="0.5"/>
    <!-- film holes -->
    <rect x="3"  y="3"  width="6" height="4" rx="1" fill="#A78BFA" opacity="0.4"/>
    <rect x="3"  y="39" width="6" height="4" rx="1" fill="#A78BFA" opacity="0.4"/>
    <rect x="68" y="3"  width="6" height="4" rx="1" fill="#A78BFA" opacity="0.4"/>
    <rect x="68" y="39" width="6" height="4" rx="1" fill="#A78BFA" opacity="0.4"/>
    <!-- stub star -->
    <polygon points="13,10 15,16 21,16 16,20 18,26 13,22 8,26 10,20 5,16 11,16" fill="#4F46E5"/>
    <!-- text -->
    <text x="52" y="19" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="10" font-weight="900" fill="#EDE9FE">MF</text>
    <text x="52" y="34" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="10" font-weight="900" fill="#A78BFA">107</text>
  </g>

  <!-- ── REEL (right, scaled down) ── -->
  <g transform="translate(182, 108)">
    <circle cx="42" cy="23" r="34" fill="#161430" stroke="#6D28D9" stroke-width="1.2"/>
    <circle cx="42" cy="23" r="24" fill="#0D0B1E" stroke="#4F46E5" stroke-width="0.8"/>
    <!-- spokes -->
    <line x1="42" y1="0"  x2="42" y2="23" stroke="#4F46E5" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="42" y1="46" x2="42" y2="23" stroke="#4F46E5" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="22" y1="11" x2="42" y2="23" stroke="#4F46E5" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="62" y1="35" x2="42" y2="23" stroke="#4F46E5" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="22" y1="35" x2="42" y2="23" stroke="#4F46E5" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="62" y1="11" x2="42" y2="23" stroke="#4F46E5" stroke-width="3.5" stroke-linecap="round"/>
    <!-- spoke ends -->
    <circle cx="42" cy="1"  r="5" fill="#A78BFA"/>
    <circle cx="42" cy="45" r="5" fill="#A78BFA"/>
    <circle cx="22" cy="12" r="5" fill="#A78BFA"/>
    <circle cx="62" cy="34" r="5" fill="#A78BFA"/>
    <circle cx="22" cy="34" r="5" fill="#A78BFA"/>
    <circle cx="62" cy="12" r="5" fill="#A78BFA"/>
    <!-- hub -->
    <circle cx="42" cy="23" r="10" fill="#0D0B1E" stroke="#A78BFA" stroke-width="1.2"/>
    <circle cx="42" cy="23" r="4"  fill="#4F46E5"/>
    <circle cx="42" cy="23" r="2"  fill="#A78BFA"/>
    <!-- sprocket holes -->
    <circle cx="42" cy="-8"  r="4" fill="#0D0B1E" stroke="#A78BFA" stroke-width="1"/>
    <circle cx="42" cy="54"  r="4" fill="#0D0B1E" stroke="#A78BFA" stroke-width="1"/>
    <circle cx="12" cy="8"   r="4" fill="#0D0B1E" stroke="#A78BFA" stroke-width="1"/>
    <circle cx="72" cy="38"  r="4" fill="#0D0B1E" stroke="#A78BFA" stroke-width="1"/>
    <circle cx="12" cy="38"  r="4" fill="#0D0B1E" stroke="#A78BFA" stroke-width="1"/>
    <circle cx="72" cy="8"   r="4" fill="#0D0B1E" stroke="#A78BFA" stroke-width="1"/>
  </g>

  <!-- ── POPCORN (bottom center, scaled down) ── -->
  <g transform="translate(107, 172)">
    <path d="M14,28 L18,58 L68,58 L72,28 Z" fill="#4F46E5"/>
    <path d="M28,28 L30,58" stroke="#EDE9FE" stroke-width="5" opacity="0.12"/>
    <path d="M43,28 L43,58" stroke="#EDE9FE" stroke-width="5" opacity="0.12"/>
    <path d="M58,28 L56,58" stroke="#EDE9FE" stroke-width="5" opacity="0.12"/>
    <rect x="10" y="24" width="66" height="8"  rx="4" fill="#6D28D9"/>
    <rect x="14" y="36" width="58" height="12" fill="#3730A3" opacity="0.6"/>
    <text x="43" y="47" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="7" font-weight="900" fill="#C4B5FD" letter-spacing="1">MF107</text>
    <!-- puffs back -->
    <ellipse cx="20" cy="22" rx="12" ry="10" fill="#C4B5FD"/>
    <ellipse cx="43" cy="14" rx="15" ry="12" fill="#EDE9FE"/>
    <ellipse cx="66" cy="22" rx="12" ry="10" fill="#C4B5FD"/>
    <!-- puffs front -->
    <ellipse cx="10" cy="28" rx="11" ry="9"  fill="#DDD6FE"/>
    <ellipse cx="32" cy="20" rx="13" ry="11" fill="#EDE9FE"/>
    <ellipse cx="54" cy="20" rx="13" ry="11" fill="#DDD6FE"/>
    <ellipse cx="76" cy="28" rx="11" ry="9"  fill="#C4B5FD"/>
    <!-- highlights -->
    <circle cx="38" cy="11" r="4" fill="#ffffff" opacity="0.35"/>
    <circle cx="18" cy="20" r="3" fill="#ffffff" opacity="0.25"/>
    <circle cx="64" cy="20" r="3" fill="#ffffff" opacity="0.25"/>
  </g>

  <!-- ── ARC TEXT TOP: MOVIEFLIX ── -->
  <path id="arcT" d="M 58 150 A 92 92 0 0 1 242 150" fill="none"/>
  <text font-family="Arial Black, Arial, sans-serif" font-size="14" font-weight="900" fill="#C4B5FD" letter-spacing="5">
    <textPath href="#arcT" startOffset="7%">MOVIEFLIX</textPath>
  </text>

  <!-- ── ARC TEXT BOTTOM: EST · 107 · ── -->
  <path id="arcB" d="M 62 150 A 88 88 0 0 0 238 150" fill="none"/>
  <text font-family="Arial, sans-serif" font-size="9" fill="#818CF8" letter-spacing="5" opacity="0.85">
    <textPath href="#arcB" startOffset="22%">EST · 107 ·</textPath>
  </text>

</svg>
